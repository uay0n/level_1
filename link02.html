<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="">
    <meta name="description" content="">
    <title>링크태그</title>
</head>
<body>
    <h1>링크태그</h1><!-- <a> 요소는 href 속성을 통해 다른페이지나 같은 페이지에 있는 링크/하이퍼링크 -->
    <h2>절대경로</h2>
    <p>http://로 시작하는 실제 웹 서비스 주소</p>
    <a href="http://google.com" target="_blank">구글 바로가기</a>
    <a href="https://www.naver.com/" target="_blank">네이버 바로가기</a>
    <a href="https://www.apple.com/" target="_blank">애플 바로가기</a>
    <!-- 네이버 쇼핑탭 클론코딩(실제이는 사이트와 동일하게 하게 만드는) -->
    <div id="shopping_wrap">
        <!-- 1. 쇼핑 제목 탭 -->
        <div class="title_controls_wrap">
            <div class="title">
                <a href="#">쇼핑</a><img src="" alt="">
                <a href="#">맨즈</a><img src="" alt="">
                <a href="#">브랜드샵</a><img src="" alt="">
                <a href="#" class="active"></a>My추천</a><img src="" alt="">
                <a href="#">추천핫딜</a><img src="" alt="">
                <a href="#">쇼핑라이브</a>
            </div> <!-- e:title -->
            <div class="controls">
                <em class="current_page">1</em>
                <span class="total_page">/11</span>
                <a href=""class="prev_btn"><img src="" alt="이전상품보기"></a>
                <a href=""class="next_btn"><img src="" alt="다음상품보기"></a>
            </div> <!-- e:controls -->
        </div>
        <!-- 2. 쇼핑 내용(광고, 주문, 추천태그, 상품목록) -->
        <div class="container">
            <div class="side_bar">
                <div class="shopping_mall">
                    <a href="https://www.coupang.com/" target="_blank"><em>쿠팡</em></a>
                    <a href="https://www.gmarket.co.kr/" target="_blank">G마켓</a>
                    <a href="https://www.auction.co.kr/" target="_blank">옥션</a>
                    <a href="https://www.11st.co.kr/" target="_blank">11번가</a>
                    <a href="https://www.oliveyoung.co.kr/" target="_blank">올리브영</a>
                    <a href="https://www.ssg.com/" target="_blank">SSG닷컴</a>
                    <a href="https://www.halfclub.com/" target="_blank">하프클럽</a>
                    <a href="https://emart.ssg.com/" target="_blank">이마트몰</a>
                    <a href="https://with.gsshop.com/" target="_blank">GS SHOP</a>
                    <a href="https://www.fashionplus.co.kr/" target="_blank">패션플러스</a>
                </div> <!-- e:shopping_mall  -->
                <div class="shipping_basket"> <!-- 내가 한 거 -->
                    <a href="#" target="_blank">주문배송<span class="count">3</span></a>
                    <a href="#" target="_blank">장바구니<span class="count">1</span></a>
                    <!-- 선생님이 보여주신 거 -->
                    <a href="#" class="order">주문 <img src="" alt="3"></a>
                    <a href="#" class="cart">장바구니 <img src="" alt="1"></a>
                </div> <!-- e:shipping_basket -->
                <a href="https://smartstore.naver.com/" target="_blank" class="shopping video"><video src="" class="shopping Reels"></video></a>
            </div> <!-- e : side_bar -->
            <div class="right_contents">
                <a href="#" class="product">
                    <p class="photo"><img src="" alt=""></p>
                    <p class="msg">불만족 시 반품가능</p>
                    <h2>자누아 경추베개</h2>
                    <div class="review_score_wrap">
                        <p class="score"><img src="" alt="별점">4.79</p>
                        <p class="review">리뷰 225</p>
                    </div>
                </a><!-- *8(복제의미) -->
            </div> <!-- e:right_contents -->
        </div>
        <!-- 3. 내용 더보기 -->
        <div class="more_wrap">
            <div class="center">
                <a href="#" class="prev_btn"><img src=""alt="이전보기"></a>
                <div class="more_page">
                    <em>쇼핑아이템</em><span>더보기</span></a>
                    <em class="current_page">1</em></em>
                    <span class="total_page">/9</span>
                </div>
                <a href="#" class="next_btn"><img src=""alt="다음보기"></a>
            </div><!-- e:center -->
            <a href="#" class="ad_btn">AD</a>
        </div><!-- e:more_wrap -->
    </div><!-- e:shopping_wrap -->
</body>
</html>
